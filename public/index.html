<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Importa o arquivo de estilos principal do site -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Define o ícone da aba do navegador -->
    <link rel="icon" type="image/svg+xml" href="../../assets/svg/logo-icon.svg" />

    <!-- Redireciona automaticamente para a página de login ao acessar index.html -->
    <script>
      window.location.href = "app/auth/login.html";
    </script>
  </head>
<body>   <script>
      document.addEventListener("DOMContentLoaded", function () {
        const avatar = document.querySelector(".avatar");
        const email = localStorage.getItem("userEmail");
        if (avatar && email && typeof email === "string" && email.length > 0) {
          avatar.textContent = email[0].toUpperCase();
        }
      });
    </script>
    <!-- O body está vazio pois o redirecionamento é imediato -->
    <script>
      // Redireciona para o perfil com userId na query string
      document.addEventListener("DOMContentLoaded", function () {
        var profileLink = document.getElementById("profile-link");
        if (profileLink) {
          profileLink.addEventListener("click", function (e) {
            e.preventDefault();
            var userId = localStorage.getItem("userId");
            if (userId) {
              window.location.href = `../collaborators/collaborators-detail/collaborators-detail.html?id=${userId}`;
            } else {
              window.location.href =
                "../collaborators/collaborators-detail/collaborators-detail.html";
            }
          });
        }
      });
    </script>
</body>
</html>
