<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="squads.page_title"></title>
    <link rel="stylesheet" href="squads-form.css" />
    <link rel="stylesheet" href="../../../../assets/css/style.css" />
    <link
      type="image/svg+xml"
      rel="icon"
      href="../../../../assets/svg/logo.svg"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../../assets/svg/logo-icon.svg"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <img
        src="../../../../assets/svg/logo.svg"
        alt="Logo POPs"
        class="logo-header"
        style="height: 32px; vertical-align: middle; margin-right: 8px"
      />
      <nav>
        <a
          href="../../dashboard/dashboard.html"
          data-i18n="navbar.dashboard"
        ></a>
        <a class="active" href="../squads.html" data-i18n="navbar.squads"></a>
        <a href="../../projects/projects.html" data-i18n="navbar.projects"></a>
        <a
          href="../../collaborators/collaborators.html"
          data-i18n="navbar.collaborators"
        ></a>
        <a
          href="../../jobs-skills/jobs-skills.html"
          data-i18n="navbar.jobs_skills"
        ></a>
        <a href="../../area/area.html" data-i18n="navbar.area"></a>
      </nav>
      <div class="profile-menu">
        <button
          id="theme-toggle"
          class="theme-toggle-btn"
          title="Alternar tema"
        >
          <span id="theme-icon">🌞</span>
        </button>
        <div class="avatar">K</div>
        <span class="chevron" aria-hidden="true">
          <svg
            width="20"
            height="10"
            viewBox="0 0 21 9.5"
            fill="none"
            stroke="#555"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline poincreate-squad-pagets="2 2 10.5 7.5 19 2" />
          </svg>
        </span>
        <div id="dropdown" class="dropdown hidden">
          <a
            href="../../collaborators/collaborators-detail/collaborators-detail.html"
            data-i18n="navbar.profile"
          ></a>
          <a href="../../inbox/inbox.html" data-i18n="navbar.inbox"></a>
          <a href="../../../auth/login.html" data-i18n="navbar.logout"></a>
        </div>
      </div>
    </header>
    <!-- Formulário de cadastro -->
    <main class="create-squad-page">
      <img
        src="../../../../assets/svg/left-arrow.svg"
        alt="Voltar"
        style="
          vertical-align: middle;
          margin-right: 4px;
          width: 30px;
          height: 30px;
        "
      />
      <a href="../squads.html" class="back-link" data-i18n="squads_form.back"
        ><img
          src="../../../../assets/svg/left-arrow.svg"
          alt="Voltar"
          style="
            vertical-align: middle;
            margin-right: 4px;
            width: 30px;
            height: 30px;
          "
      /></a>
      <div class="form-container">
        <h2 data-i18n="squads_form.create_title"></h2>
        <form class="form-squad">
          <label data-i18n="squads_form.team_name"></label>
          <input
            type="text"
            data-i18n-placeholder="squads_form.team_name_placeholder"
          />
          <div class="row">
            <div class="col">
              <label data-i18n="squads_form.project"></label>
              <select>
                <option data-i18n="squads_form.select_project"></option>
              </select>
            </div>
            <div class="col">
              <label data-i18n="squads_form.area"></label>
              <select>
                <option data-i18n="squads_form.select_area"></option>
              </select>
            </div>
          </div>
          <label data-i18n="squads_form.description"></label>
          <textarea
            data-i18n-placeholder="squads_form.description_placeholder"
          ></textarea>
          <label data-i18n="squads_form.approver"></label>
          <select>
            <option data-i18n="squads_form.select_approver"></option>
          </select>
          <div class="team-section">
            <h3 data-i18n="squads_form.team"></h3>

            <div class="d-flex add-people-hover">
              <p data-i18n="squads_form.add_people"></p>
              <img
                src="../../../../assets/svg/add.svg"
                alt="Adicione pessoas"
                style="
                  vertical-align: middle;
                  margin-left: 6px;
                  margin-top: 26px;
                  width: 20px;
                  height: 20px;
                "
              />
            </div>
          </div>
          <div class="team-list"></div>
          <div class="form-actions">
            <button
              class="cancel btn"
              type="cancel"
              data-i18n="squads_form.cancel"
            ></button>
            <button
              type="submit"
              class="save btn"
              data-i18n="squads_form.save"
            ></button>
          </div>
        </form>
      </div>
    </main>
    <!-- Overlay -->
    <div class="modal-overlay hidden" id="modalOverlay"></div>
    <!-- Modal de adicionar colaborador -->
    <div class="modal hidden" id="addMemberModal">
      <div class="modal-header">
        <h2 id="modalTitle" data-i18n="squads_form.add_member"></h2>
        <button class="close-btn" id="closeModal">×</button>
      </div>
      <form class="form-modal" id="addMemberForm">
        <label for="memberName" data-i18n="squads_form.member_name"></label>
        <select id="memberName">
          <option data-i18n="squads_form.member_name_placeholder"></option>
        </select>
        <label for="allocatedHours" data-i18n="squads_form.hours"></label>
        <select id="allocatedHours">
          <option data-i18n="squads_form.select_hours"></option>
        </select>
        <label for="memberRoles" data-i18n="squads_form.roles"></label>
        <select id="memberRoles">
          <option data-i18n="squads_form.select_roles"></option>
          <option>Product Owner</option>
          <option>Techlead</option>
          <option>QA</option>
          <option>UX Designer</option>
          <option>Desenvolvedor Sênior</option>
          <option>Tester</option>
          <option>Analista</option>
        </select>
        <div class="tags-container" id="selectedRoles"></div>
        <div class="form-actions">
          <button
            type="button"
            class="btn cancel"
            id="cancelAdd"
            data-i18n="squads_form.form_cancel"
          ></button>
          <button
            type="submit"
            class="btn save-modal"
            data-i18n="squads_form.form_add"
          ></button>
        </div>
      </form>
    </div>
    <script src="../../../../assets/js/app.js"></script>
    <script src="../../../../assets/js/i18nService.js"></script>
    <script src="squads-form.js"></script>
  </body>
</html>
