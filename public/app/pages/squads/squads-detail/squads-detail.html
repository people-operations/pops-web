<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="squads_detail.team_title">POPs Squads</title>
    <link rel="stylesheet" href="squads-detail.css" />
    <link rel="stylesheet" href="../../../../assets/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../../assets/svg/logo-icon.svg"
    />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const avatar = document.querySelector(".avatar");
        const email = localStorage.getItem("userEmail");
        if (avatar && email && typeof email === "string" && email.length > 0) {
          avatar.textContent = email[0].toUpperCase();
        }
      });
    </script>
    <div
      id="loader"
      class="center"
      style="height: 100vh; font-size: 1.5rem; background-color: #fff"
    ></div>
    <div id="main-content" class="hidden">
      <header>
        <img
          src="../../../../assets/svg/logo.svg"
          alt="Logo POPs"
          class="logo-header"
          style="height: 32px; vertical-align: middle; margin-right: 8px"
          onclick="window.location.href='../../dashboard/dashboard.html'"
        />
        <nav>
          <a href="../../dashboard/dashboard.html">
            <img
              src="../../../../assets/svg/graphic.svg"
              alt="Dashboard "
              width="20"
              height="20"
              style="vertical-align: middle; margin-right: 6px" />
            <span data-i18n="navbar.dashboard"></span
          ></a>
          <a class="active" href="../squads.html">
            <img
              src="../../../../assets/svg/squads.svg"
              alt="Squads"
              width="20"
              height="20"
              class="logo-header"
              style="vertical-align: middle; margin-right: 6px"
            />
            <span data-i18n="navbar.squads"></span>
          </a>
          <a href="../../projects/projects.html">
            <img
              src="../../../../assets/svg/projects.svg"
              alt="Projetos"
              width="20"
              height="20"
              style="vertical-align: middle; margin-right: 6px"
            />
            <span data-i18n="navbar.projects"></span>
          </a>
          <a href="../../collaborators/collaborators.html" data-require-access="1,2">
            <img
              src="../../../../assets/svg/colaborator.svg"
              alt="Colaboradores"
              width="20"
              height="20"
              style="vertical-align: middle; margin-right: 6px"
            />
            <span data-i18n="navbar.collaborators"></span>
          </a>
        </nav>
        <div class="profile-menu">
          <button
            id="theme-toggle"
            class="theme-toggle-btn"
            title="Alternar tema"
          >
            <span id="theme-icon">
              <svg
                width="22"
                height="22"
                viewBox="0 0 22 22"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="11"
                  cy="11"
                  r="5"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <g
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <line x1="11" y1="1" x2="11" y2="3" />
                  <line x1="11" y1="19" x2="11" y2="21" />
                  <line x1="1" y1="11" x2="3" y2="11" />
                  <line x1="19" y1="11" x2="21" y2="11" />
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                  <line x1="16.36" y1="16.36" x2="17.78" y2="17.78" />
                  <line x1="4.22" y1="17.78" x2="5.64" y2="16.36" />
                  <line x1="16.36" y1="5.64" x2="17.78" y2="4.22" />
                </g>
              </svg>
            </span>
          </button>
          <div class="avatar"></div>
          <span class="chevron" aria-hidden="true">
            <svg
              width="20"
              height="10"
              viewBox="0 0 21 9.5"
              fill="none"
              stroke="#555"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="2 2 10.5 7.5 19 2" />
            </svg>
          </span>
          <div id="dropdown" class="dropdown hidden">
            <a
        id="profile-link"
              href="#"
              ><span data-i18n="navbar.profile"></span
            ></a>
            <a href="../configurations/general/general.html"
              ><span data-i18n="navbar.settings"></span
            ></a>
            <a href="../../auth/login.html"
              ><span data-i18n="navbar.logout"></span
            ></a>
          </div>
        </div>
      </header>
      <main class="container">
        <!-- Sidebar summary -->
        <div class="summary">
          <div class="summary-header">
            <h2 data-i18n="squads_detail.team_title"></h2>
            <div class="summary-actions">
              <img
                src="../../../../assets/svg/edit-button.svg"
                alt="Editar"
                class="action-icon"
                style="vertical-align: middle; width: 34px; height: 34px"
                title=""
                data-i18n="squads_detail.edit"
              />
              <img
                src="../../../../assets/svg/trash-button.svg"
                alt="Remover"
                class="action-icon"
                style="vertical-align: middle; width: 34px; height: 34px"
                title=""
                data-i18n="squads_detail.remove"
              />
            </div>
          </div>
          <div class="projects-count" id="projects-count" style="display: inline-block; background: #2f7d32; color: #fff; border-radius: 50px; padding: 4px 10px; font-size: 14px; font-weight: 500; margin-bottom: 12px;">0 projetos ativos</div>
          <p class="description" data-i18n="squads_detail.description"></p>
          <p class="info-line">
            <strong data-i18n="squads_detail.members"></strong> <span id="members-count">0</span>
          </p>
          <p class="info-line" id="hours-info">
            <strong>Horas totais:</strong> <span id="total-hours">-</span> • 
            <strong>Horas aplicadas:</strong> <span id="allocated-hours-info">-</span>
          </p>
          <p class="info-line" id="overload-info">
            <strong>Índice de sobrecarga:</strong> <span id="overload-percent">-</span>
          </p>
          <p class="info-line" id="sprint-info" style="display: none;">
            <strong>Duração do Sprint:</strong> <span id="sprint-duration">-</span> semanas
          </p>
        </div>
        <!-- Main content -->
        <section class="content">
          <!-- Team members -->
          <div class="team-members">
            <header class="projects-header">
              <h4 data-i18n="squads_detail.team"></h4>
            </header>
            <div class="members-list" id="members-list">
              <!-- Os cards de membros serão renderizados via JS -->
            </div>
          </div>
          <!-- Projects list -->
          <div class="projects-list">
            <header class="projects-header">
              <h4 data-i18n="squads_detail.projects"></h4>
            </header>
            <div id="projects-cards">
              <!-- Os cards de projetos serão renderizados via JS -->
            </div>
          </div>
        </section>
      </main>
      <!-- Modal de confirmação de exclusão -->
      <div
        id="delete-modal"
        class="modal"
        style="
          display: none;
          position: fixed;
          width: 100vw;
          height: 100vh;
          background: rgba(0, 0, 0, 0.4);
          z-index: 9999;
          align-items: center;
          justify-content: center;
        "
      >
        <div
          style="
            background: #fff;
            padding: 32px 24px;
            border-radius: 8px;
            max-width: 90vw;
            min-width: 320px;
            box-shadow: 0 2px 16px #0002;
            text-align: center;
          "
        >
          <h3 style="margin-bottom: 16px">
            Tem certeza que deseja excluir esta squad?
          </h3>
          <p style="color: #888; margin-bottom: 24px">
            Esta ação não poderá ser desfeita.
          </p>
          <button
            id="confirm-delete-btn"
            style="
              background: #e53935;
              color: #fff;
              border: none;
              padding: 10px 24px;
              border-radius: 4px;
              margin-right: 12px;
              cursor: pointer;
            "
          >
            Excluir
          </button>
          <button
            id="cancel-delete-btn"
            style="
              background: #eee;
              color: #333;
              border: none;
              padding: 10px 24px;
              border-radius: 4px;
              cursor: pointer;
            "
          >
            Cancelar
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="squads-detail.js"></script>
    <script src="../../../../assets/js/app.js"></script>
    <script src="../../../../assets/js/i18nService.js"></script>
    <script>
      // Redireciona para o perfil com userId na query string
      document.addEventListener("DOMContentLoaded", function () {
        var profileLink = document.getElementById("profile-link");
        if (profileLink) {
          profileLink.addEventListener("click", function (e) {
            e.preventDefault();
            var userId = localStorage.getItem("userId");
            if (userId) {
              window.location.href = `../collaborators/collaborators-detail/collaborators-detail.html?id=${userId}`;
            } else {
              window.location.href =
                "../collaborators/collaborators-detail/collaborators-detail.html";
            }
          });
        }
      });
    </script>
</body>
</html>
