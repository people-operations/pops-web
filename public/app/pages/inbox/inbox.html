<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>POPs Caixa de Entrada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="inbox.css" />
    <link rel="stylesheet" href="../../../assets/css/style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../assets/svg/logo-icon.svg"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,700&display=swap"
      rel="stylesheet"
    />
  </head>
<body>   <script>
      document.addEventListener("DOMContentLoaded", function () {
        const avatar = document.querySelector(".avatar");
        const email = localStorage.getItem("userEmail");
        if (avatar && email && typeof email === "string" && email.length > 0) {
          avatar.textContent = email[0].toUpperCase();
        }
      });
    </script>
    <!-- ====== Header ====== -->
    <header>
      <img
        src="../../../assets/svg/logo.svg"
        alt="Logo POPs"
        class="logo-header"
        style="height: 32px; vertical-align: middle; margin-right: 8px"
        onclick="window.location.href='../dashboard/dashboard.html'"
      />
      <nav>
        <a href="../dashboard/dashboard.html">
          <img
            src="../../../assets/svg/graphic.svg"
            width="20"
            height="20"
            alt="Dashboard"
          />
          <span data-i18n="navbar.dashboard">Dashboard</span>
        </a>
        <a href="../squads/squads.html">
          <img
            src="../../../assets/svg/squads.svg"
            width="20"
            height="20"
            alt="Squads"
          />
          <span data-i18n="navbar.squads">Squads</span>
        </a>
        <a href="../projects/projects.html">
          <img
            src="../../../assets/svg/projects.svg"
            width="20"
            height="20"
            alt="Projetos"
          />
          <span data-i18n="navbar.projects">Projetos</span>
        </a>
        <a href="../collaborators/collaborators.html">
          <img
            src="../../../assets/svg/colaborator.svg"
            width="20"
            height="20"
            alt="Colaboradores"
          />
          <span data-i18n="navbar.collaborators">Colaboradores</span>
        </a>
      </nav>
      <div class="profile-menu">
        <button
          id="theme-toggle"
          class="theme-toggle-btn"
          title="Alternar tema"
        >
          <span id="theme-icon">
            <svg
              width="22"
              height="22"
              viewBox="0 0 22 22"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                cx="11"
                cy="11"
                r="5"
                stroke="currentColor"
                stroke-width="2"
              />
              <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="11" y1="1" x2="11" y2="3" />
                <line x1="11" y1="19" x2="11" y2="21" />
                <line x1="1" y1="11" x2="3" y2="11" />
                <line x1="19" y1="11" x2="21" y2="11" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="16.36" y1="16.36" x2="17.78" y2="17.78" />
                <line x1="4.22" y1="17.78" x2="5.64" y2="16.36" />
                <line x1="16.36" y1="5.64" x2="17.78" y2="4.22" />
              </g>
            </svg>
          </span>
        </button>
        <div class="avatar"></div>
        <span class="chevron" aria-hidden="true">
          <svg
            width="20"
            height="10"
            viewBox="0 0 21 9.5"
            fill="none"
            stroke="#555"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="2 2 10.5 7.5 19 2" />
          </svg>
        </span>
        <div id="dropdown" class="dropdown hidden">
          <a
            href="../collaborators/collaborators-detail/collaborators-detail.html"
            ><span data-i18n="navbar.profile">Perfil</span></a
          >
          <a href="../inbox/inbox.html"
            ><span data-i18n="navbar.inbox">Caixa de Entrada</span></a
          >
          <a href="../configurations/general/general.html"
            ><span data-i18n="navbar.settings">Configurações</span></a
          >
          <a href="../../auth/login.html"
            ><span data-i18n="navbar.logout">Sair</span></a
          >
        </div>
      </div>
    </header>

    <!-- ====== Main ====== -->
    <main class="container">
      <h2 class="gradient-title">Caixa de entrada</h2>
      <div class="subtitle">Verifique suas notificações</div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div
          class="select"
          id="year-select"
          role="button"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <select id="year-label"></select>
        </div>

        <div class="tabs" role="tablist">
          <button
            class="tab active"
            data-tab="general"
            role="tab"
            aria-selected="true"
          >
            Notificação geral
          </button>
          <button class="tab" data-tab="feedback" role="tab">
            Pedidos de feedback
          </button>
          <button class="tab" data-tab="approval" role="tab">
            Pedidos de aprovação de squad
          </button>
        </div>
        <div class="spacer"></div>
      </div>

      <!-- Card + Table -->
      <section class="table">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
<script src="inbox.js"></script>
<script src="../../../assets/js/app.js"></script>
<script src="../../../assets/js/i18nService.js" defer></script>
