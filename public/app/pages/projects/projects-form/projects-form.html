<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>POPs Projetos</title>
    <link rel="stylesheet" href="projects-form.css" />
    <link rel="stylesheet" href="../../../../assets/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../../assets/svg/logo-icon.svg"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <img
        src="../../../../assets/svg/logo.svg"
        alt="Logo POPs"
        class="logo-header"
        style="height: 32px; vertical-align: middle; margin-right: 8px"
        onclick="window.location.href='../../dashboard/dashboard.html'"
      />
      <nav>
        <a href="../../dashboard/dashboard.html">
          <img
            src="../../../../assets/svg/graphic.svg"
            alt="Dashboard "
            width="20"
            height="20"
            style="vertical-align: middle; margin-right: 6px" />
          <span data-i18n="navbar.dashboard"></span
        ></a>
        <a href="../../squads/squads.html">
          <img
            src="../../../../assets/svg/squads.svg"
            alt="Squads"
            width="20"
            height="20"
            class="logo-header"
            style="vertical-align: middle; margin-right: 6px"
          />
          <span data-i18n="navbar.squads"></span>
        </a>
        <a class="active" href="../projects.html">
          <img
            src="../../../../assets/svg/projects.svg"
            alt="Projetos"
            width="20"
            height="20"
            style="vertical-align: middle; margin-right: 6px"
          />
          <span data-i18n="navbar.projects"></span>
        </a>
        <a href="../../collaborators/collaborators.html" data-require-access="1,2">
          <img
            src="../../../../assets/svg/colaborator.svg"
            alt="Colaboradores"
            width="20"
            height="20"
            style="vertical-align: middle; margin-right: 6px"
          />
          <span data-i18n="navbar.collaborators"></span>
        </a>
      </nav>
      <div class="profile-menu">
        <button
          id="theme-toggle"
          class="theme-toggle-btn"
          title="Alternar tema"
        >
          <span id="theme-icon">
            <svg
              width="22"
              height="22"
              viewBox="0 0 22 22"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                cx="11"
                cy="11"
                r="5"
                stroke="currentColor"
                stroke-width="2"
              />
              <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="11" y1="1" x2="11" y2="3" />
                <line x1="11" y1="19" x2="11" y2="21" />
                <line x1="1" y1="11" x2="3" y2="11" />
                <line x1="19" y1="11" x2="21" y2="11" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="16.36" y1="16.36" x2="17.78" y2="17.78" />
                <line x1="4.22" y1="17.78" x2="5.64" y2="16.36" />
                <line x1="16.36" y1="5.64" x2="17.78" y2="4.22" />
              </g>
            </svg>
          </span>
        </button>
        <div class="avatar"></div>
        <span class="chevron" aria-hidden="true">
          <svg
            width="20"
            height="10"
            viewBox="0 0 21 9.5"
            fill="none"
            stroke="#555"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="2 2 10.5 7.5 19 2" />
          </svg>
        </span>
        <div id="dropdown" class="dropdown hidden">
     <a id="profile-link" href="#"
            ><span data-i18n="navbar.profile">Perfil</span></a
          >
          <a href="../../configurations/general/general.html"
            ><span data-i18n="navbar.settings"></span
          ></a>
          <a href="../../../auth/login.html"
            ><span data-i18n="navbar.logout"></span
          ></a>
        </div>
      </div>
    </header>
    <!-- Conteúdo Principal -->
    <main class="create-project-page">
      <a href="../projects.html" class="back-link">
        <img src="../../../../assets/svg/left-arrow.svg" alt="Voltar" />
        <span data-i18n="projects_form.back"></span>
      </a>
      <!-- Skeleton Loader -->
      <div
        id="skeleton-loader"
        class="skeleton-container"
        style="display: none"
      >
        <div class="skeleton-title"></div>
        <div class="skeleton-row">
          <div class="skeleton-input"></div>
        </div>
        <div class="skeleton-row">
          <div class="skeleton-input"></div>
          <div class="skeleton-input"></div>
        </div>
        <div class="skeleton-row">
          <div class="skeleton-textarea"></div>
        </div>
        <div class="skeleton-row">
          <div class="skeleton-input"></div>
          <div class="skeleton-input"></div>
          <div class="skeleton-input"></div>
        </div>
        <div class="skeleton-row">
          <div class="skeleton-btn"></div>
          <div class="skeleton-btn"></div>
        </div>
      </div>
      <div class="form-container" id="form-container">
        <h2 id="form-title" data-i18n="projects_form.create_title"></h2>
        <form class="form-project">
          <!-- Nome -->
          <label data-i18n="projects_form.name"></label>
          <input
            type="text"
            id="name-input"
            data-i18n-placeholder="projects_form.name_placeholder"
            required
          />

          <!-- Tipo / Status -->
          <div class="row">
            <div class="col">
              <label data-i18n="projects_form.type"></label>
              <select id="type-select" required>
                <option
                  data-i18n="projects_form.select_type"
                  disabled
                  selected
                  hidden
                ></option>
              </select>
            </div>
            <div class="col">
              <label data-i18n="projects_form.status"></label>
              <select id="status-select" required>
                <option
                  data-i18n="projects_form.select_status"
                  disabled
                  selected
                  hidden
                ></option>
              </select>
            </div>
          </div>

          <!-- Descrição -->
          <label data-i18n="projects_form.description"></label>
          <textarea
            id="description-input"
            rows="4"
            data-i18n-placeholder="projects_form.description_placeholder"
            required
          ></textarea>

          <!-- Área -->
          <label data-i18n="projects_form.area">Área</label>
          <input
            type="text"
            id="area-input"
            data-i18n-placeholder="Área que beneficiária do projeto"
            placeholder="Ex: Tecnologia, Financeiro, RH..."
          />

          <!-- Budget / Datas -->
          <div class="row">
            <div class="col">
              <label data-i18n="projects_form.budget"></label>
              <input
                type="text"
                id="budget-input"
                data-i18n-placeholder="projects_form.budget_placeholder"
                required
                inputmode="numeric"
                autocomplete="off"
                maxlength="20"
                placeholder="R$ 0,00"
              />
            </div>
            <div class="col">
              <label data-i18n="projects_form.start_date"></label>
              <input
                type="text"
                id="start-date-input"
                data-i18n-placeholder="projects_form.start_date_placeholder"
                placeholder="dd/mm/yyyy"
                autocomplete="off"
                required
                readonly
              />
              <div
                class="datepicker"
                id="datepicker-start"
                style="display: none"
              ></div>
            </div>
            <div class="col">
              <label data-i18n="projects_form.end_date"></label>
              <input
                type="text"
                id="end-date-input"
                data-i18n-placeholder="projects_form.end_date_placeholder"
                placeholder="dd/mm/yyyy"
                autocomplete="off"
                required
                readonly
              />
              <div
                class="datepicker"
                id="datepicker-end"
                style="display: none"
              ></div>
            </div>
          </div>
          <!-- Botões -->
          <div class="form-actions">
            <button
              type="button"
              class="cancel"
              id="cancel-btn"
              data-i18n="projects_form.cancel"
            ></button>
            <button
              type="submit"
              class="save"
              id="save-btn"
              data-i18n="projects_form.save"
              disabled
            ></button>
          </div>
        </form>
      </div>
    </main>

    <script src="../../../../assets/js/i18nService.js" defer></script>
    <script src="../../../../assets/js/app.js"></script>
    <script type="module" src="projects-form.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const avatar = document.querySelector(".avatar");
        const email = localStorage.getItem("userEmail");
        if (avatar && email && typeof email === "string" && email.length > 0) {
          avatar.textContent = email[0].toUpperCase();
        }
      });
    </script>
    <script>
      // Redireciona para o perfil com userId na query string
      document.addEventListener("DOMContentLoaded", function () {
        var profileLink = document.getElementById("profile-link");
        if (profileLink) {
          profileLink.addEventListener("click", function (e) {
            e.preventDefault();
            var userId = localStorage.getItem("userId");
            if (userId) {
              window.location.href = `../../collaborators/collaborators-detail/collaborators-detail.html?id=${userId}`;
            } else {
              window.location.href =
                "../collaborators/collaborators-detail/collaborators-detail.html";
            }
          });
        }
      });
    </script>
  </body>
</html>
