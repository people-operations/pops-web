<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>POPs Projetos</title>
    <link rel="stylesheet" href="projects.css" />
    <link rel="stylesheet" href="../../../assets/css/style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../assets/svg/logo-icon.svg"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const avatar = document.querySelector(".avatar");
        const email = localStorage.getItem("userEmail");
        if (avatar && email && typeof email === "string" && email.length > 0) {
          avatar.textContent = email[0].toUpperCase();
        }
      });
    </script>
    <div
      id="loader"
      class="center"
      style="height: 100vh; font-size: 1.5rem; background-color: #fff"
    ></div>
    <div id="main-content" class="hidden">
      <header>
        <img
          src="../../../assets/svg/logo.svg"
          alt="Logo POPs"
          class="logo-header"
          style="height: 32px; vertical-align: middle; margin-right: 8px"
          onclick="window.location.href='../dashboard/dashboard.html'"
        />
        <nav>
          <a href="../dashboard/dashboard.html">
            <img
              src="../../../assets/svg/graphic.svg"
              alt="Dashboard "
              width="20"
              height="20"
              style="vertical-align: middle; margin-right: 6px" />
            <span data-i18n="navbar.dashboard"></span
          ></a>
          <a href="../squads/squads.html">
            <img
              src="../../../assets/svg/squads.svg"
              alt="Squads"
              width="20"
              height="20"
              class="logo-header"
              style="vertical-align: middle; margin-right: 6px"
            />
            <span data-i18n="navbar.squads"></span>
          </a>
          <a class="active" href="projects.html">
            <img
              src="../../../assets/svg/projects.svg"
              alt="Projetos"
              width="20"
              height="20"
              style="vertical-align: middle; margin-right: 6px"
            />
            <span data-i18n="navbar.projects"></span>
          </a>
          <a href="../collaborators/collaborators.html">
            <img
              src="../../../assets/svg/colaborator.svg"
              alt="Colaboradores"
              width="20"
              height="20"
              style="vertical-align: middle; margin-right: 6px"
            />
            <span data-i18n="navbar.collaborators"></span>
          </a>
        </nav>
        <div class="profile-menu">
          <button
            id="theme-toggle"
            class="theme-toggle-btn"
            title="Alternar tema"
          >
            <span id="theme-icon">
              <svg
                width="22"
                height="22"
                viewBox="0 0 22 22"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="11"
                  cy="11"
                  r="5"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <g
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <line x1="11" y1="1" x2="11" y2="3" />
                  <line x1="11" y1="19" x2="11" y2="21" />
                  <line x1="1" y1="11" x2="3" y2="11" />
                  <line x1="19" y1="11" x2="21" y2="11" />
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                  <line x1="16.36" y1="16.36" x2="17.78" y2="17.78" />
                  <line x1="4.22" y1="17.78" x2="5.64" y2="16.36" />
                  <line x1="16.36" y1="5.64" x2="17.78" y2="4.22" />
                </g>
              </svg>
            </span>
          </button>
          <div class="avatar"></div>
          <span class="chevron" aria-hidden="true">
            <svg
              width="20"
              height="10"
              viewBox="0 0 21 9.5"
              fill="none"
              stroke="#555"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="2 2 10.5 7.5 19 2" />
            </svg>
          </span>
          <div id="dropdown" class="dropdown hidden">
            <a
        id="profile-link"
              href="#"
              ><span data-i18n="navbar.profile"></span
            ></a>
            <a href="../inbox/inbox.html"
              ><span data-i18n="navbar.inbox"></span
            ></a>
            <a href="../configurations/general/general.html"
              ><span data-i18n="navbar.settings"></span
            ></a>
            <a href="../../auth/login.html"
              ><span data-i18n="navbar.logout"></span
            ></a>
          </div>
        </div>
      </header>
      <main class="projects-container">
        <div class="projects-header">
          <div>
            <h2 class="gradient-title" data-i18n="projects.main_title"></h2>
            <p class="subtitle" data-i18n="projects.subtitle"></p>
          </div>
          <button
            class="btn btn-purple"
            onclick="window.location.href='projects-form/projects-form.html'"
            data-i18n="projects.create"
          ></button>
        </div>
        <div class="projects-filters">
          <div class="filter-group">
            <label for="name-filter">Nome do Projeto:</label>
            <input type="text" id="name-filter" class="filter-input" placeholder="Buscar por nome...">
          </div>
          <div class="filter-group">
            <label for="active-filter">Status do Projeto:</label>
            <select id="active-filter" class="filter-select">
              <option value="all">Todos</option>
              <option value="active">Ativos</option>
              <option value="inactive">Inativos</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="status-filter">Status:</label>
            <select id="status-filter" class="filter-select">
              <option value="">Todos os status</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="type-filter">Tipo:</label>
            <select id="type-filter" class="filter-select">
              <option value="">Todos os tipos</option>
            </select>
          </div>
          <button class="btn outlined" id="clear-filters">Limpar filtros</button>
        </div>
        <div id="project-list" class="project-cards"></div>
        <div class="pagination-container" id="pagination-container" style="display: none;">
          <div class="pagination-info">
            <span id="pagination-text">Mostrando 1-9 de <span id="total-count">0</span> resultados</span>
          </div>
          <div class="pagination-controls">
            <button id="prev-page" class="pagination-btn" disabled>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Anterior
            </button>
            <div id="pagination-numbers" class="pagination-numbers"></div>
            <button id="next-page" class="pagination-btn">
              Próxima
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="projects.js"></script>
    <script src="../../../assets/js/app.js"></script>
    <script src="../../../assets/js/i18nService.js" defer></script>
    <script>
      // Redireciona para o perfil com userId na query string
      document.addEventListener("DOMContentLoaded", function () {
        var profileLink = document.getElementById("profile-link");
        if (profileLink) {
          profileLink.addEventListener("click", function (e) {
            e.preventDefault();
            var userId = localStorage.getItem("userId");
            if (userId) {
              window.location.href = `../collaborators/collaborators-detail/collaborators-detail.html?id=${userId}`;
            } else {
              window.location.href =
                "../collaborators/collaborators-detail/collaborators-detail.html";
            }
          });
        }
      });
    </script>
</body>
</html>
