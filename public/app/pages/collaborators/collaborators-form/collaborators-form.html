<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>POPs Colaboradores</title>
    <link rel="stylesheet" href="collaborators-form.css" />
    <link rel="stylesheet" href="../../../../assets/css/style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../../assets/svg/logo-icon.svg"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <img
        src="../../../../assets/svg/logo.svg"
        alt="Logo POPs"
        class="logo-header"
        style="height: 32px; vertical-align: middle; margin-right: 8px"
        onclick="window.location.href='../../dashboard/dashboard.html'"
      />
      <nav>
        <a href="../../dashboard/dashboard.html">
          <img
            src="../../../../assets/svg/graphic.svg"
            alt="Dashboard "
            width="20"
            height="20"
            style="vertical-align: middle; margin-right: 6px" />
          <span data-i18n="navbar.dashboard"></span
        ></a>
        <a href="../../squads/squads.html">
          <img
            src="../../../../assets/svg/squads.svg"
            alt="Squads"
            width="20"
            height="20"
            class="logo-header"
            style="vertical-align: middle; margin-right: 6px"
          />
          <span data-i18n="navbar.squads"></span>
        </a>
        <a href="../../projects/projects.html">
          <img
            src="../../../../assets/svg/projects.svg"
            alt="Projetos"
            width="20"
            height="20"
            style="vertical-align: middle; margin-right: 6px"
          />
          <span data-i18n="navbar.projects"></span>
        </a>
        <a class="active" href="../collaborators.html">
          <img
            src="../../../../assets/svg/colaborator.svg"
            alt="Colaboradores"
            width="20"
            height="20"
            style="vertical-align: middle; margin-right: 6px"
          />
          <span data-i18n="navbar.collaborators"></span>
        </a>
      </nav>
      <div class="profile-menu">
        <button
          id="theme-toggle"
          class="theme-toggle-btn"
          title="Alternar tema"
        >
          <span id="theme-icon">🌞</span>
        </button>
        <div class="avatar">K</div>
        <span class="chevron" aria-hidden="true">
          <svg
            width="20"
            height="10"
            viewBox="0 0 21 9.5"
            fill="none"
            stroke="#555"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="2 2 10.5 7.5 19 2" />
          </svg>
        </span>
        <div id="dropdown" class="dropdown hidden">
          <a
            href="../../collaborators/collaborators-detail/collaborators-detail.html"
            ><span data-i18n="navbar.profile"></span
          ></a>
          <a href="../../inbox/inbox.html"
            ><span data-i18n="navbar.inbox"></span
          ></a>
          <a href="../../configurations/general/general.html"
            ><span data-i18n="navbar.settings"></span
          ></a>
          <a href="../../../auth/login.html"
            ><span data-i18n="navbar.logout"></span
          ></a>
        </div>
      </div>
    </header>

    <main class="create-collaborator-page">
      <a href="../collaborators/collaborators.html" class="back-link">
        <img src="../../../../assets/svg/left-arrow.svg" alt="Voltar" />
        <span data-i18n="collaborators_form.back"
          >Voltar para colaboradores</span
        >
      </a>
      <div class="form-container">
        <h2 data-i18n="collaborators_form.create_title">
          Adicionar um novo colaborador
        </h2>

        <!-- Tabs -->
        <div class="tabs">
          <button
            class="tab active"
            data-step="1"
            data-i18n="collaborators_form.tab_personal"
          >
            Informações pessoais
          </button>
          <button
            class="tab"
            data-step="2"
            data-i18n="collaborators_form.tab_residential"
          >
            Informações residenciais
          </button>
          <button
            class="tab"
            data-step="3"
            data-i18n="collaborators_form.tab_professional"
          >
            Informações profissionais
          </button>
        </div>

        <form id="collabForm" class="form-collaborator">
          <!-- Step 1: Personal -->
          <div class="form-step" data-step="1">
            <div class="row">
              <div class="col upload-photo">
                <label data-i18n="collaborators_form.photo_label"
                  >Foto aqui</label
                >
                <div
                  class="photo-dropzone"
                  data-i18n="collaborators_form.photo_hint"
                >
                  Arraste a foto aqui
                </div>
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.full_name"
                  >Nome completo *</label
                >
                <input
                  type="text"
                  placeholder="Digite no campo"
                  data-i18n-placeholder="collaborators_form.full_name_placeholder"
                />
              </div>
            </div>

            <label data-i18n="collaborators_form.entity">Entidade *</label>
            <input type="text" placeholder="Casado/Solteiro/Viúvo" />

            <div class="row">
              <div class="col">
                <label data-i18n="collaborators_form.cpf">CPF *</label>
                <input type="text" placeholder="000.000.000-00" />
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.cnpj">CNPJ</label>
                <input type="text" placeholder="000.000.000-00" />
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.birth_date"
                  >Data de nascimento *</label
                >
                <input type="text" placeholder="00/00/00" />
              </div>
            </div>

            <div class="row">
              <div class="col">
                <label data-i18n="collaborators_form.email">Email *</label>
                <input type="email" placeholder="Digite no campo" />
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.phone">Telefone *</label>
                <input type="text" placeholder="(00) 00000-0000" />
              </div>
            </div>

            <label data-i18n="collaborators_form.linkedin">LinkedIn</label>
            <input type="url" placeholder="Link aqui do url" />
          </div>

          <!-- Step 2: Residential -->
          <div class="form-step hidden" data-step="2">
            <div class="row">
              <div class="col">
                <label data-i18n="collaborators_form.cep">CEP</label>
                <input type="text" placeholder="00000-000" />
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.neighborhood"
                  >Bairro</label
                >
                <input type="text" placeholder="Digite no campo" />
              </div>
            </div>

            <label data-i18n="collaborators_form.street">Logradouro</label>
            <input type="text" placeholder="Digite no campo" />

            <div class="row">
              <div class="col">
                <label data-i18n="collaborators_form.number">Número</label>
                <input type="text" placeholder="Digite no campo" />
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.complement"
                  >Complemento</label
                >
                <input type="text" placeholder="Digite no campo" />
              </div>
            </div>

            <div class="row">
              <div class="col">
                <label data-i18n="collaborators_form.city">Cidade</label>
                <select>
                  <option>Selecione</option>
                </select>
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.state">Estado</label>
                <select>
                  <option>Selecione</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Step 3: Professional -->
          <div class="form-step hidden" data-step="3">
            <div class="row">
              <div class="col">
                <label data-i18n="collaborators_form.manager">Gestor</label>
                <select>
                  <option>Selecione</option>
                </select>
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.role"
                  >Cargo de atuação</label
                >
                <input type="text" placeholder="Digite no campo" />
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.seniority"
                  >Senioridade</label
                >
                <select>
                  <option>Selecione</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col">
                <label data-i18n="collaborators_form.contract_type"
                  >Tipo de contrato</label
                >
                <select>
                  <option>Selecione</option>
                </select>
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.salary">Salário</label>
                <input type="text" placeholder="R$ 00000" />
              </div>
            </div>

            <div class="row">
              <div class="col">
                <label data-i18n="collaborators_form.admission_date"
                  >Data de admissão</label
                >
                <input type="text" placeholder="Digite no campo" />
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.end_date"
                  >Data de encerramento do contrato</label
                >
                <input type="text" placeholder="Digite no campo" />
              </div>
              <div class="col">
                <label data-i18n="collaborators_form.status">Status</label>
                <select>
                  <option>Está em férias ou não</option>
                </select>
              </div>
            </div>

            <label data-i18n="collaborators_form.work_hours"
              >Carga horária</label
            >
            <input type="text" placeholder="Digite no campo" />

            <h3 data-i18n="collaborators_form.skills_needed">Skills</h3>
            <div class="tags-container">
              <span class="tag">Node.js <button>×</button></span>
              <span class="tag">Java <button>×</button></span>
              <span class="tag">HTML <button>×</button></span>
              <span class="tag">Typescript <button>×</button></span>
              <button class="add-tag">+</button>
            </div>
          </div>

          <!-- Navigation Buttons -->
          <div class="form-actions">
            <button
              type="button"
              class="btn outline prev-btn"
              data-i18n="collaborators_form.back"
            >
              Voltar
            </button>
            <button
              type="button"
              class="btn outline cancel-btn"
              data-i18n="collaborators_form.cancel"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn primary next-btn"
              data-i18n="collaborators_form.next"
            >
              Próximo
            </button>
            <button
              type="submit"
              class="btn primary save-btn hidden"
              data-i18n="collaborators_form.save"
            >
              Salvar
            </button>
          </div>
        </form>
      </div>
    </main>
    <script src="collaborators-form.js"></script>
    <script src="../../../../assets/js/app.js"></script>
    <script src="../../../../assets/js/i18nService.js" defer></script>
  </body>
</html>
