<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="recover.css" />
    <link rel="stylesheet" href="../../../assets/css/style.css" />
    <link rel="icon" type="image/svg+xml" href="../../../assets/svg/logo.svg" />
  </head>
  <body>
    <div class="recover-bg">
      <canvas id="stars-bg"></canvas>
      <div class="recover-form" id="step-email">
        <h2>Recuperar Senha</h2>
        <label for="recover-email">Digite seu e-mail</label>
        <input
          type="email"
          id="recover-email"
          placeholder="seu@email.com"
          required
        />
        <button id="send-token-btn" class="btn">Enviar código</button>
      </div>
      <div class="recover-form" id="step-token" style="display: none">
        <h2>Verifique seu e-mail</h2>
        <p>Enviamos um código de 5 dígitos para seu e-mail.</p>
        <div class="token-inputs">
          <input
            maxlength="1"
            class="token-digit"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
          />
          <input
            maxlength="1"
            class="token-digit"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
          />
          <input
            maxlength="1"
            class="token-digit"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
          />
          <input
            maxlength="1"
            class="token-digit"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
          />
          <input
            maxlength="1"
            class="token-digit"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
          />
        </div>
        <div id="timer">00:30</div>
        <button
          id="resend-token-btn"
          style="display: none; margin-bottom: 1rem"
          class="btn"
        >
          Reenviar código
        </button>

        <div id="token-error" class="error"></div>
      </div>
      <div class="recover-form" id="step-password" style="display: none">
        <h2>Redefinir Senha</h2>
        <label for="new-password">Nova senha</label>
        <div class="password-group" style="position: relative">
          <input type="password" id="new-password" required />
          <span
            class="toggle-password"
            aria-label="Mostrar/ocultar senha"
            tabindex="0"
            data-target="new-password"
            style="
              position: absolute;
              right: 0.75rem;
              top: 50%;
              transform: translateY(-50%);
              cursor: pointer;
            "
          >
            <!-- SVG de olho fechado (inicial) -->
            <svg
              class="eye-closed"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                fill="currentColor"
                d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <!-- SVG de olho aberto (escondido inicialmente) -->
            <svg
              class="eye-open"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
              style="display: none"
            >
              <path
                fill="currentColor"
                d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"
              />
            </svg>
          </span>
        </div>
        <label for="confirm-password">Confirmar senha</label>
        <div class="password-group" style="position: relative">
          <input type="password" id="confirm-password" required />
          <span
            class="toggle-password"
            aria-label="Mostrar/ocultar senha"
            tabindex="0"
            data-target="confirm-password"
          >
            <!-- SVG de olho fechado (inicial) -->
            <svg
              class="eye-closed"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                fill="currentColor"
                d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <!-- SVG de olho aberto (escondido inicialmente) -->
            <svg
              class="eye-open"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
              style="display: none"
            >
              <path
                fill="currentColor"
                d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"
              />
            </svg>
          </span>
        </div>
        <button id="save-password-btn" class="btn">Salvar nova senha</button>
        <div id="password-error" class="error"></div>
      </div>
      <div class="recover-form" id="step-success" style="display: none">
        <h2>Senha redefinida!</h2>
        <button id="go-login-btn" class="btn">Voltar para login</button>
      </div>
    </div>
  </body>
</html>
<script src="recover.js"></script>
<script src="../../../assets/js/app.js"></script>
