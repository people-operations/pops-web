<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="login.page_title"></title>
    <!-- Estilos específicos da página de login -->
    <link rel="stylesheet" href="login.css" />
    <!-- Estilos globais do projeto -->
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <!-- Fonte Poppins do Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,700&display=swap"
      rel="stylesheet"
    />
    <!-- Ícone da aba do navegador -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/svg/logo-icon.svg"
    />
  </head>
  <body>
    <div class="container">
      <div class="left-panel">
        <div class="welcome-row">
          <h1 data-i18n="login.welcome"></h1>
          <button
            id="theme-toggle"
            class="theme-toggle-btn"
            aria-label="Alternar tema"
          >
            <span id="theme-icon">
              <!-- SVG do ícone de alternância de tema. Mantido sem comentários pois é autoexplicativo. -->
              <svg
                width="22"
                height="22"
                viewBox="0 0 22 22"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="11"
                  cy="11"
                  r="5"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <g
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <line x1="11" y1="1" x2="11" y2="3" />
                  <line x1="11" y1="19" x2="11" y2="21" />
                  <line x1="1" y1="11" x2="3" y2="11" />
                  <line x1="19" y1="11" x2="21" y2="11" />
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                  <line x1="16.36" y1="16.36" x2="17.78" y2="17.78" />
                  <line x1="4.22" y1="17.78" x2="5.64" y2="16.36" />
                  <line x1="16.36" y1="5.64" x2="17.78" y2="4.22" />
                </g>
              </svg>
            </span>
          </button>
        </div>
        <p class="lead" data-i18n="login.no_access"></p>
        <form id="login-form">
          <div class="form-group floating">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              required
            />
            <label for="email" data-i18n="login.email"></label>
          </div>
          <div class="form-group floating" style="position: relative">
            <label for="password" data-i18n="login.password"></label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
            <!-- Toggle de visibilidade da senha: ícones de olho fechado/aberto. Comentado pois envolve manipulação visual dinâmica. -->
            <span
              id="toggle-password"
              class="toggle-password"
              aria-label="Mostrar/ocultar senha"
              tabindex="0"
            >
              <svg
                id="eye-closed"
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  fill="currentColor"
                  d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                id="eye-open"
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                fill="none"
                viewBox="0 0 24 24"
                style="display: none"
              >
                <path
                  fill="currentColor"
                  d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"
                />
              </svg>
            </span>
          </div>
          <button type="submit" class="btn" data-i18n="login.submit"></button>
          <p class="help-text">
            <span data-i18n="login.help"></span>&nbsp;
            <a href="recover/recover.html" data-i18n="login.reset"></a>
          </p>
        </form>
      </div>
      <div class="right-panel">
        <div class="right-panel-bg">
          <!-- Canvas para efeito visual de estrelas no fundo. Mantido comentado pois é uma parte visual não trivial. -->
          <canvas id="stars-bg"></canvas>
          <div class="content">
            <div class="row title-row">
              <h2 data-i18n="login.platform.title"></h2>
            </div>
            <div class="row subtitle-row">
              <p data-i18n="login.platform.description"></p>
            </div>

            <div class="row icon-row">
              <div class="svg">
                <img
                  src="../../assets/svg/login-icon.svg"
                  alt="Ícone de login"
                  width="332"
                  height="348"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Scripts organizados: internacionalização, lógica principal e módulo de login. -->
    <script src="../../assets/js/i18nService.js" defer></script>
    <script src="../../assets/js/app.js"></script>
    <script type="module" src="login.js"></script>
    <script>
      // Redireciona para o perfil com userId na query string
      document.addEventListener("DOMContentLoaded", function () {
        var profileLink = document.getElementById("profile-link");
        if (profileLink) {
          profileLink.addEventListener("click", function (e) {
            e.preventDefault();
            var userId = localStorage.getItem("userId");
            if (userId) {
              window.location.href = `../collaborators/collaborators-detail/collaborators-detail.html?id=${userId}`;
            } else {
              window.location.href =
                "../collaborators/collaborators-detail/collaborators-detail.html";
            }
          });
        }
      });
    </script>
</body>
</html>
